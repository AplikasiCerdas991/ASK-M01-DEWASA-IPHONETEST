:root{

  --micro-feedback:220ms;
  --micro-screen:260ms;
  --micro-complete:360ms;
}
.sc{
  transform-origin:50% 18%;
}
.sc.ask-screen-enter{
  animation:askScreenEnter var(--micro-screen) cubic-bezier(.2,.75,.25,1) both;
}
@keyframes askScreenEnter{
  from{opacity:.72;transform:translateY(7px)}
  to{opacity:1;transform:none}
}
.btn,.ans,.more,.back-mini,.menu-item,.audio-slot{
  -webkit-tap-highlight-color:transparent;
  transition:
    transform var(--micro-fast) ease,
    box-shadow var(--micro-feedback) ease,
    background var(--micro-feedback) ease,
    border-color var(--micro-feedback) ease,
    opacity var(--micro-feedback) ease;
}
.btn:active,.ans:active,.more:active,.back-mini:active,.menu-item:active,.audio-slot:active{
  transform:scale(.975);
}
.ans.ask-selected-correct{
  border-color:#176B5B!important;
  background:#e8f5ef!important;
  box-shadow:0 0 0 3px rgba(23,107,91,.10)!important;
}
.ans.ask-selected-wrong{
  border-color:#b7775c!important;
  background:#fff1eb!important;
  box-shadow:0 0 0 3px rgba(183,119,92,.09)!important;
}
.ask-feedback{
  position:fixed;z-index:70;left:50%;top:50%;
  transform:translate(-50%,-46%) scale(.96);
  width:min(330px,calc(100vw - 40px));
  padding:18px 20px;border-radius:22px;
  background:rgba(16,47,41,.97);color:#fff;
  box-shadow:0 24px 70px rgba(0,0,0,.24);
  text-align:center;font-weight:800;line-height:1.45;
  opacity:0;pointer-events:none;

let __askFeedbackTimer=null;
function askFeedback(kind,msg,done){askA11yAnnounce(msg);
  let f=document.getElementById("askFeedback");
  if(!f){
    f=document.createElement("div");
    f.id="askFeedback";f.className="ask-feedback";f.setAttribute("role","status");
    document.body.appendChild(f);
  }
  f.className="ask-feedback "+(kind==="wrong"?"wrong":"");
  f.innerHTML=`<span class="fi">${kind==="wrong"?"↺":"✓"}</span>${msg}`;
  requestAnimationFrame(()=>f.classList.add("show"));
  clearTimeout(__askFeedbackTimer);
  __askFeedbackTimer=setTimeout(()=>{
    f.classList.remove("show");
    setTimeout(()=>{if(done)done()},180);
  },kind==="wrong"?620:520);
}

function askA11yAnnounce(msg){const el=document.getElementById("askA11yLive");if(!el)return;el.textContent="";setTimeout(()=>el.textContent=msg||"",20)}

function askE07SpiritualLayer(){
  const sc=document.querySelector("#app .sc");
  if(!sc)return;

  const add=(key,title,text)=>{
    if(sc.querySelector(`[data-e07="${key}"]`))return;
    const note=document.createElement("div");
    note.className="ask-spiritual-note";
    note.dataset.e07=key;
    note.setAttribute("role","note");
    note.innerHTML=`<span class="ask-alhamdulillah">${title}</span><p>${text}</p>`;
    const target=sc.querySelector(".milestone") || sc.querySelector(".card.sage") || sc.querySelector(".card");
    if(target) target.insertAdjacentElement("afterend",note);
  };

  if(s.screen==="learnDone"){
    add("learning-complete","Alhamdulillah","Anda telah melalui 4 kalimah, 2 frasa dan bacaan lengkap. Sekarang kukuhkan apa yang telah dipelajari.");
  }

  if(s.screen==="pm"){
    add("assessment-complete","Alhamdulillah","Pembelajaran Modul 1 telah diselesaikan. Semakan ingatan kemudian membantu melihat sama ada pembelajaran ini masih dapat diingati.");
  }

  if(s.screen==="summary"){
    const verified=ids.filter(id=>s.mastery[id]==="RETENTION_VERIFIED").length;
    if(verified===7){
      add("retention-complete","Alhamdulillah","Semakan ingatan bagi 7 objek pembelajaran telah selesai.");
    }else{
      add("retention-progress","Teruskan dengan tenang","Semakan ini membantu anda mengukuhkan bahagian yang masih memerlukan perhatian.");
    }
  }

  if(["learnDone","pm","summary"].includes(s.screen)){
    const card=sc.querySelector(".card.dark,.hero>div,.milestone");
    if(card)card.classList.add("ask-gentle-complete");
  }
}

function setAudioButtonState(id,state){
  const b=document.querySelector(`[data-audio-slot="AUD-${id}"]`);
  if(!b)return;
  if(state==="playing"){
    b.classList.add("is-playing");
    b.disabled=true;
    b.textContent="Sedang dimainkan…";
    b.setAttribute("aria-busy","true");
  }else{
    b.classList.remove("is-playing");
    b.disabled=false;
    b.textContent=state==="done"?"Dengar semula":"Dengar";
    b.removeAttribute("aria-busy");
  }
}

function toastBM(msg){
  let t=document.getElementById("askToast");
  if(!t){t=document.createElement("div");t.id="askToast";t.className="ask-toast";t.setAttribute("role","status");document.body.appendChild(t)}
  t.textContent=msg;t.classList.add("show");clearTimeout(window.__askToastTimer);
  window.__askToastTimer=setTimeout(()=>t.classList.remove("show"),2400);
}
function audioSlot(id){
  const o=O[id];
  if(!o||!o[0]){toastBM("Bacaan belum tersedia.");return}
  if(!("speechSynthesis" in window)||typeof SpeechSynthesisUtterance==="undefined"){
    toastBM("Audio tidak dapat dimainkan pada pelayar ini.");return
  }
  try{
    speechSynthesis.cancel();
    setAudioButtonState(id,"playing");
    const u=new SpeechSynthesisUtterance(o[0]);
    u.lang="ar-SA";u.rate=.72;u.pitch=1;u.volume=1;
    u.onstart=()=>toastBM("Audio sedang dimainkan…");
    u.onend=()=>setAudioButtonState(id,"done");
    u.onerror=()=>{setAudioButtonState(id,"ready");toastBM("Audio tidak dapat dimainkan. Cuba sekali lagi.");};
    speechSynthesis.speak(u);
  }catch(e){
    setAudioButtonState(id,"ready");
    toastBM("Audio tidak dapat dimainkan. Cuba sekali lagi.");
  }
}

function answer(i,k,re){
  if(s.lock)return;
  s.lock=true;
  let id=ids[s.ai],ok=i===k;
  const buttons=[...document.querySelectorAll(".ans")];
  if(buttons[i])buttons[i].classList.add(ok?"ask-selected-correct":"ask-selected-wrong");
  rec(re?"RECHECK":"PRIMARY_ASSESSMENT",id,s.phase,ok);
  if(!ok){
    s.wrong[id+"_"+s.phase]=true;
    askFeedback("wrong","Mari lihat semula dengan tenang.",()=>go("remed"));
  }else{
    askFeedback("correct","Tepat",()=>advance());
  }
}

function demo(){return ""}
function waiting(recov){let ready=recov?s.rq.filter(i=>s.clock>=(s.due[i]||9999)).length:(s.clock>=24?7:0),tot=recov?s.rq.length:7,recTitle=recov?(ready?"Sedia untuk Semakan Semula":"Semakan Semula Akan Tersedia"):"Semak Ingatan Kemudian";return `<section class="sc">${H(recTitle,`${ready} / ${tot} tersedia`)}<div class="card"><h1>${recTitle}</h1><p class="sub">${ready?"Semakan sudah tersedia.":"Semakan belum tersedia."}</p></div><div class="card sage"><b>${ready} daripada ${tot} tersedia</b></div><div class="cta">${ready?`<button class="btn" onclick="${recov?"go('recovery')":"s.ri=0;go('ret')"}">${recov?"Mulakan Semakan Semula":"Mulakan Semak Ingatan"}</button>`:""}<button class="btn alt" onclick="go('m02')">Lihat Modul 2 yang tersedia</button></div></section>`}
function ret(recov){let id=recov?s.rq[s.rqi]:ids[s.ri],vi=recov?1-fv[ids.indexOf(id)]:fv[ids.indexOf(id)],z=B[id][vi],item=`RET-${id}-${vi?"B":"A"}-GM1`;return `<section class="sc">${H(recov?"Semak Semula Ingatan":"Semak Ingatan",`${recov?s.rqi+1:s.ri+1} / ${recov?s.rq.length:7}`)}<div class="card"><h2>${z[0]}</h2>${id==="FULL"?`<div class="ar full">${O.FULL[0]}</div>`:""}</div><div class="opts">${z[1].map((a,i)=>`<button class="ans" onclick="retAns(${i},${z[2]},'${id}','${item}',${recov})">${a}</button>`).join("")}</div></section>`}
function retAns(i,k,id,item,re){if(s.lock)return;s.lock=true;let ok=i===k;rec(re?"RECOVERY_DELAYED_RESPONSE":"PRIMARY_DELAYED_RETENTION_RESPONSE",id,item,ok);if(re){if(ok){s.rv[id]=true;delete s.rw[id];s.rqi++;s.lock=false;s.rqi>=s.rq.length?go("summary"):render()}else{alert("Perlukan Sokongan Lanjut. Tiada Variant C dicipta.");go("summary")}return}if(ok){s.rv[id]=true;s.ri<6?(s.ri++,s.lock=false,render()):finishRet()}else{s.rw[id]=true;go("strength")}}
function finishStrength(id){rec("STRENGTHENING",id,"CANONICAL_SUPPORT",true);s.due[id]=s.clock+24;if(s.ri<6){s.ri++;go("ret")}else finishRet()}function finishRet(){s.rq=ids.filter(i=>s.rw[i]&&!s.rv[i]);s.rqi=0;s.rq.length?go("rwait"):go("summary")}

function toggleMenu(e){
  if(e)e.stopPropagation();
  const m=document.getElementById("askMenu"),b=document.getElementById("menuBackdrop");
  const open=!m.classList.contains("open");
  m.classList.toggle("open",open);b.classList.toggle("open",open);
}
function closeMenu(){
  const m=document.getElementById("askMenu"),b=document.getElementById("menuBackdrop");
  if(m)m.classList.remove("open");if(b)b.classList.remove("open");
}
function menuSummary(){closeMenu();go("summary")}
function menuAudit(){closeMenu();audit()}
function menuSettings(){
  closeMenu();
  toastBM("Tetapan prototaip belum diperlukan untuk perjalanan Modul 1.");
}
function menuHelp(){
  closeMenu();
  toastBM("Bantuan: selepas selesai Padankan, tekan ⋯ dan pilih Mod Semakan untuk melihat status pembelajaran.");
}
function menuExit(){
  closeMenu();
  go("open");
  toastBM("Kembali ke skrin utama prototaip.");
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const q=document.getElementById("qhDrawer");if(q&&q.classList.contains("open"))closeQHDrawer();else closeMenu()}});

function audit(){s.audit=!s.audit;save();drawAudit()}function drawAudit(){let d=document.getElementById("audit");d.classList.toggle("open",s.audit);let last=s.receipts.at(-1);d.innerHTML=`<div class="top"><div><b>MOD SEMAKAN</b><div class="mod">REAL ASK M01 V1.1</div></div><button class="more" onclick="audit()">✕</button></div>${[["Skrin",({open:"Utama",journey:"Perjalanan",learn:"Pembelajaran",learnDone:"Pembelajaran selesai",fc:"Kad imbas",assess:"Penilaian",remed:"Pengukuhan",recheck:"Cuba semula",pm:"Penguasaan sementara",wait:"Menunggu semakan",ret:"Semakan ingatan",strength:"Pengukuhan ingatan",rwait:"Menunggu semakan semula",summary:"Ringkasan",m02:"Modul 2"}[s.screen]||s.screen)],["Penguasaan sementara",s.pm?"Ya":"Belum"],["Ingatan disahkan",ids.filter(i=>s.rv[i]).length+"/7"],["Perlu pengukuhan",ids.filter(i=>s.rw[i]&&!s.rv[i]).length],["Modul 2",s.m02?"TERSEDIA":"BELUM TERSEDIA"],["QH Gate A",s.qh?.A||"NOT_SEEN"],["QH Gate B",s.qh?.B||"NOT_SEEN"],["QH Gate C",s.qh?.C||"NOT_SEEN"],["Rekod terakhir",last?"Tersimpan":"—"]].map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join("")}`}

render();
document.addEventListener("keydown",e=>{const t=e.target;if((e.key==="Enter"||e.key===" ")&&t&&t.classList&&t.classList.contains("menu-item")&&t.tagName!=="BUTTON"){e.preventDefault();t.click()}});
</script>

<div id="qhDrawerBackdrop" class="qh-drawer-backdrop" onclick="closeQHDrawer()" aria-hidden="true"></div>
<aside id="qhDrawer" class="qh-drawer" role="dialog" aria-modal="true" aria-labelledby="qhDrawerTitle" aria-hidden="true"></aside>

<div id="menuBackdrop" class="menu-backdrop" onclick="closeMenu()"></div>
<div id="askMenu" class="menu-pop" role="menu" aria-label="Menu ASK">
  <button class="menu-item" role="menuitem" onclick="menuSummary()"><span class="mi">▣</span><span>Ringkasan</span></button>
  <button class="menu-item" role="menuitem" onclick="menuAudit()"><span class="mi">⚙</span><span>Mod Semakan</span></button>
  <div class="menu-sep"></div>
  <button class="menu-item" role="menuitem" onclick="menuSettings()"><span class="mi">⚙</span><span>Tetapan</span></button>
  <button class="menu-item" role="menuitem" onclick="menuHelp()"><span class="mi">?</span><span>Bantuan</span></button>
  <button class="menu-item" role="menuitem" onclick="menuExit()"><span class="mi">↪</span><span>Keluar</span></button>
</div>

</body></html>
